# On-chain (paid) overlay. Layer it on the offchain base:
#   docker compose -f compose.yml -f compose.onchain.yml up -d --build
#   uv run client.py --input hello --signer http://localhost:7936
#
# Adds a remote signer holding the payer wallet, re-points the orchestrator
# on-chain, and registers the app with a price so the orchestrator issues a
# payment challenge. Needs a local .env (gitignored): copy .env.example.

services:
  signer:
    # A standalone go-livepeer in signer mode. It holds the funded payer wallet
    # and mints tickets; it cannot run offchain. The client reaches it via --signer.
    image: livepeer/go-livepeer:v0.9.1
    container_name: livepeer_runner_signer
    command:
      - -remoteSigner
      - -network=${NETWORK}
      - -ethUrl=${ETH_RPC_URL}
      - -ethKeystorePath=/keystore
      - -ethAcctAddr=${SIGNER_ETH_ACCT}
      - -ethPassword=${SIGNER_ETH_PASSWORD}
      - -httpAddr=0.0.0.0:7936
      - -maxPricePerUnit=${MAX_PRICE_PER_UNIT}
      - -v=6
      # LOCAL DEMO ONLY. This skips signer caller-auth: it binds 0.0.0.0 and
      # signs for anyone who can reach it, which spends your deposit. In
      # production authorize callers with -remoteSignerWebhookUrl instead.
      - -remoteSignerAllowNoAuth
    ports:
      - "7936:7936"
    volumes:
      - ${SIGNER_KEYSTORE_DIR}:/keystore:ro

  orchestrator:
    command:
      - -orchestrator
      - -useLiveRunners
      - -serviceAddr=127.0.0.1:8935
      - -httpAddr=0.0.0.0:8935
      - -liveRunnerAddr=https://orchestrator:8935
      - -orchSecret=abcdef
      - -network=${NETWORK}
      - -ethUrl=${ETH_RPC_URL}
      - -ethKeystorePath=/keystore
      - -ethAcctAddr=${ORCH_ETH_ACCT}
      - -ethPassword=${ORCH_ETH_PASSWORD}
      - -ethOrchAddr=${ORCH_ONCHAIN_ADDR}
      # Price comes from the app's registration; -pricePerUnit only sets the
      # unused legacy base price, but an on-chain O won't boot without it.
      - -pricePerUnit=0
      # Expected value per ticket. A payment needs fee / ticketEV tickets and the
      # signer signs at most 100 at once, which is what caps the price.
      - -ticketEV=10000000000
      - -maxFaceValue=4000000000000000
      - -monitor=false
      - -v=6
    volumes:
      - ${ORCH_KEYSTORE_DIR}:/keystore:ro

  # Re-declare the command to advertise a price; the base registers free.
  app:
    command:
      - --host=0.0.0.0
      - --orchestrator=https://orchestrator:8935
      - --orchSecret=abcdef
      - --runner-url=http://app:8989
      - --price=${PRICE}
