name: build

# Builds the app image so an orchestrator operator can pull and run it.
#
# Publishes to GitHub Container Registry with no setup: GITHUB_TOKEN is enough,
# and the image lands at ghcr.io/<owner>/<repo>. To publish elsewhere (Docker
# Hub, a private registry), set the repository variables IMAGE_NAME and
# REGISTRY_USERNAME plus the secret REGISTRY_TOKEN.
#
# Pull requests build only. Pushing happens on main, on v* tags, and on manual
# dispatch, so a fork's PR can never publish.
#
# amd64 only: Livepeer GPU work is NVIDIA/amd64, and there is no CUDA on arm64.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publishing to ghcr.io
    env:
      IMAGE: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}', github.repository) }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          # Defaults to ghcr.io with the built-in token; overridden together with
          # IMAGE_NAME when publishing somewhere else.
          registry: ${{ vars.REGISTRY_USERNAME && '' || 'ghcr.io' }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
