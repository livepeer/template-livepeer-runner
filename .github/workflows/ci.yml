name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Runs every hook in .pre-commit-config.yaml against all files.
      - uses: pre-commit/action@v3.0.1

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate offchain compose
        run: docker compose -f compose.yml config --quiet
      # The on-chain overlay interpolates .env values into flags and volume
      # mounts, so an unset variable becomes an invalid spec that only shows up
      # at `up` time. Dummy values catch that here instead.
      - name: Validate on-chain overlay
        run: docker compose -f compose.yml -f compose.onchain.yml config --quiet
        env:
          NETWORK: arbitrum-one-mainnet
          ETH_RPC_URL: https://arb1.arbitrum.io/rpc
          SIGNER_KEYSTORE_DIR: /tmp/signer-keystore
          SIGNER_ETH_ACCT: "0x0000000000000000000000000000000000000000"
          SIGNER_ETH_PASSWORD: dummy
          ORCH_KEYSTORE_DIR: /tmp/orch-keystore
          ORCH_ETH_ACCT: "0x0000000000000000000000000000000000000000"
          ORCH_ETH_PASSWORD: dummy
          ORCH_ONCHAIN_ADDR: "0x0000000000000000000000000000000000000000"
          PRICE: "0.0001"
          MAX_PRICE_PER_UNIT: 0.000111USD
